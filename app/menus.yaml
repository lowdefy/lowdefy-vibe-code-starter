# @context
# Name: Lowdefy Menu Configuration
# Description: Navigation structure with menu links and groups for application routing
# Agents Context: Define menu hierarchy with MenuLink and MenuGroup components

- id: default
  links:
    - id: companies
      type: MenuLink
      properties:
        title: Companies
        icon: BsBuilding
      pageId: companies
    - id: contacts
      type: MenuLink
      properties:
        title: Contacts
        icon: AiOutlineContacts
      pageId: contacts
    - id: development
      type: MenuLink
      properties:
        title: Development
        icon: AiOutlineTool
      pageId: development
    - id: admin
      type: MenuGroup
      properties:
        title: Admin
      links:
        - id: users
          type: MenuLink
          properties:
            title: Users
            icon: AiOutlineTeam
          pageId: users
