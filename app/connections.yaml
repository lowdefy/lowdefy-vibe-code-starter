# @context
# Name: MongoDB Connections
# Description: Database configuration for MongoDB collections and connections
# Agents Context: Include changeLog for audit trails, consistent naming patterns

- id: companies
  type: MongoDBCollection
  properties:
    collection: companies
    databaseUri:
      _secret: MONGODB_URI
    write: true
    changeLog:
      collection: log-changes
      meta:
        user:
          _user: true
- id: contacts
  type: MongoDBCollection
  properties:
    collection: contacts
    databaseUri:
      _secret: MONGODB_URI
    write: true
    changeLog:
      collection: log-changes
      meta:
        user:
          _user: true
- id: log-usage
  type: MongoDBCollection
  properties:
    collection: log-usage
    databaseUri:
      _secret: MONGODB_URI
    write: true
- id: user_contacts
  type: MongoDBCollection
  properties:
    collection: user_contacts
    databaseUri:
      _secret: MONGODB_URI
    write: true
    changeLog:
      collection: log-changes
      meta:
        user:
          _user: true
- id: hello_world_api
  type: HelloWorldAPI
  properties:
    databaseUri:
      _secret: MONGODB_URI
