# @context
# Name: Contact Insertion Request
# Description: MongoDB request to insert new contact with generated ID, timestamp, and email normalization
# Agents Context: Uses shared utilities for ID generation and change tracking

id: insert_contact
type: MongoDBInsertOne
connectionId: contacts
payload:
  contact:
    _state: contact
properties:
  doc:
    _object.assign:
      - _payload: contact
      - _id:
          _ref: shared/utils/generate_short_id.yaml
        created:
          _ref: shared/change_stamp.yaml
        email:
          _string.toLowerCase:
            _string.trim:
              _if_none:
                - _payload: contact.email
                - ''
