# @context
# Name: Contact Form
# Description: Reusable form component for contact data entry
# Agents Context: Reusable form component with TextInput and Selector

id: contact_form
type: Box
layout:
  contentGutter: 8
blocks:
  - id: contact.company_id
    type: Selector
    required: true
    properties:
      title: Contact Company
      options:
        _request: companies_selector
  - id: contact.name
    type: TextInput
    required: true
    properties:
      title: Name
  - id: contact.surname
    type: TextInput
    properties:
      title: Surname
  - id: contact.email
    type: TextInput
    required: true
    properties:
      title: Email
  - id: contact.work_phone
    type: TextInput
    properties:
      title: Work Phone
  - id: contact.mobile_phone
    type: TextInput
    properties:
      title: Mobile Phone
