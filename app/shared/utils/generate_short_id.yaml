# @context
# Name: Generate Short ID
# Description: Utility function to generate short random ID
# Agents Context: Utility function to generate short random ID

_js: |
  let result = "";
  for (let i = 0; i < 4; i++) {
    const randomByte = Math.floor(Math.random() * 256);
    result += randomByte.toString(16).padStart(2, "0");
  }
  return result;
