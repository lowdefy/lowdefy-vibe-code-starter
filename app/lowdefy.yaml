# @cascade: Lowdefy App Configuration - Main Application Setup
# AI Context: Configure auth, pages, connections for AI-assisted development
# MCP Integration: Validate app structure and configuration schemas
# Patterns: name + lowdefy version + auth + pages + connections structure
# Dependencies: pages/*.yaml, connections.yaml, auth provider configuration

lowdefy: 0.0.0-experimental-20250218100608
version: 0.0.0
name: lowdefy-vibe-code-starter

cli:
  disableTelemetry: true
plugins:
  - name: '@lowdefy/community-plugin-mongodb'
    version: '2.3.0'
  - name: '@lowdefy/community-plugin-nodemailer'
    version: '1.1.4'
  - name: '@lowdefy/community-plugin-xlsx'
    version: '1.1.0'
  - name: '@lowdefy/plugin-lowdefy-vibe-code-starter'
    version: 'workspace:*'

config:
  homePageId: router

auth:
  authPages:
    signIn: '/login'
    verifyRequest: '/verify-email-request'
    error: '/login'
  adapter:
    id: mdb_adapter
    type: MultiAppMongoDBAdapter
    properties:
      # invite:
      #   required: true
      databaseUri:
        _secret: MONGODB_URI
      appName:
        _ref:
          path: app_config.yaml
          key: app_name
      verificationTokens:
        uses: 5

  providers:
    - id: email
      type: EmailProvider
      properties:
        maxAge: 1800
        server:
          host: smtp.sendgrid.net
          port: 465
          auth:
            user: apikey
            pass:
              _secret: SENDGRID_API_KEY
        from: auth@mail.lowdefy.app
        templateVariables:
          appName: Lowdefy Vibe Code Starter
          logoHeight: 52px
  userFields:
    id: user.id
    profile: user.profile
    app_attributes: user.app_attributes
    global_attributes: user.global_attributes
    roles: user.roles
  pages:
    protected: true
    public:
      - login
      - logged-out
      - verify-email-request
      - '404'
      - router
    roles:
      user-admin:
        - users
        - invites-new
        - users-edit

global:
  _ref: global.yaml

menus:
  _ref: menus.yaml

connections:
  _ref: connections.yaml

pages:
  _ref: pages.yaml
