# @context
# Name: 404 Error Page
# Description: Lowdefy page for displaying 404 errors
# Agents Context: Simple error page with Result component, minimal layout

id: '404'
type: Result
style:
  minHeight: 100vh
events:
  onMount:
    - id: not_logged_in_redirect
      type: Link
      skip:
        _ne:
          - _user: id
          - null
      params:
        home: true
properties:
  status: 404
  title: '404'
  subTitle: Sorry, the page you are visiting does not exist.
areas:
  extra:
    blocks:
      - id: home
        type: Button
        properties:
          title: Go to home page
          type: Link
          icon: AiOutlineHome
        events:
          onClick:
            - id: home
              type: Link
              params:
                home: true
