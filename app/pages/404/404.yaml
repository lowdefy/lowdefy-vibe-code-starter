# @cascade: Lowdefy Page - 404 Error Page
# AI Context: Simple error page with Result component, minimal layout
# MCP Integration: Validate Layout and Result block schemas
# Patterns: Layout > Content > Result component for error display
# Dependencies: Standalone page, no external requests or components

id: '404'
type: Result
style:
  minHeight: 100vh
events:
  onMount:
    - id: not_logged_in_redirect
      type: Link
      skip:
        _ne:
          - _user: id
          - null
      params:
        home: true
properties:
  status: 404
  title: '404'
  subTitle: Sorry, the page you are visiting does not exist.
areas:
  extra:
    blocks:
      - id: home
        type: Button
        properties:
          title: Go to home page
          type: Link
          icon: AiOutlineHome
        events:
          onClick:
            - id: home
              type: Link
              params:
                home: true
