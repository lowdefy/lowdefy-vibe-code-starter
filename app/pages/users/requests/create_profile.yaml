# @context
# Name: User Profile Creation Request
# Description: MongoDB request to initialize user profile with avatar and data
# Agents Context: Sets profile_created flag, generates avatar

id: create_profile
type: MongoDBUpdateOne
connectionId: user_contacts
payload:
  user:
    _state: user
  name:
    _string.concat:
      - _string.trim:
          _if_none:
            - _state: user.profile.given_name
            - ''
      - ' '
      - _string.trim:
          _if_none:
            - _state: user.profile.family_name
            - ''
properties:
  filter:
    _id:
      _user: id
  update:
    $set:
      profile.profile_created: true
      profile.picture:
        _string.concat:
          - https://api.dicebear.com/6.x/initials/svg?backgroundType=gradientLinear&scale=75&seed=
          - _payload: name
      profile.name:
        _payload: name
      profile.given_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.given_name
            - ''
      profile.family_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.family_name
            - ''
      profile.color:
        _payload: user.profile.color
      updated:
        _ref: shared/change_stamp.yaml
