# @context
# Name: User Profile Update Request
# Description: MongoDB request to update user profile including name, avatar, and color
# Agents Context: Uses DiceBear API for avatar generation, change stamp for audit

id: update_profile
type: MongoDBUpdateOne
connectionId: user_contacts
payload:
  user:
    _state: user
  name:
    _string.trim:
      _string.concat:
        - _string.trim:
            _if_none:
              - _state: user.profile.given_name
              - ''
        - ' '
        - _string.trim:
            _if_none:
              - _state: user.profile.family_name
              - ''
properties:
  filter:
    _id:
      _user: id
  update:
    $set:
      profile.given_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.given_name
            - ''
      profile.family_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.family_name
            - ''
      profile.name:
        _payload: name
      profile.picture:
        _string.concat:
          - https://api.dicebear.com/6.x/initials/svg?backgroundType=gradientLinear&scale=75&seed=
          - _payload: name
      profile.color:
        _payload: user.profile.color
      updated:
        _ref: shared/change_stamp.yaml
