# @context: MongoDB Request - User Profile Update
# AI Context: Update user profile with avatar regeneration and data validation
# MCP Integration: Validate MongoDBUpdateOne request schema and update operations
# Patterns: Profile updates, avatar URL generation, change tracking, field validation
# Dependencies: connections.yaml users collection, avatar service, change stamp

id: update_profile
type: MongoDBUpdateOne
connectionId: user_contacts
payload:
  user:
    _state: user
  name:
    _string.trim:
      _string.concat:
        - _string.trim:
            _if_none:
              - _state: user.profile.given_name
              - ''
        - ' '
        - _string.trim:
            _if_none:
              - _state: user.profile.family_name
              - ''
properties:
  filter:
    _id:
      _user: id
  update:
    $set:
      profile.given_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.given_name
            - ''
      profile.family_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.family_name
            - ''
      profile.name:
        _payload: name
      profile.picture:
        _string.concat:
          - https://api.dicebear.com/6.x/initials/svg?backgroundType=gradientLinear&scale=75&seed=
          - _payload: name
      profile.color:
        _payload: user.profile.color
      updated:
        _ref: shared/change_stamp.yaml
