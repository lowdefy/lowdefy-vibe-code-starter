# @context
# Name: User Administration Update Request
# Description: MongoDB request for admin to update user details, roles, and status
# Agents Context: Admin operations with role management and field validation

id: update_user
type: MongoDBUpdateOne
connectionId: user_contacts
payload:
  user:
    _state: user
  name:
    _string.trim:
      _string.concat:
        - _string.trim:
            _if_none:
              - _state: user.profile.given_name
              - ''
        - ' '
        - _string.trim:
            _if_none:
              - _state: user.profile.family_name
              - ''
properties:
  filter:
    _id:
      _payload: user._id
  update:
    $set:
      disabled:
        _payload: user.disabled
      apps.lowdefy-vibe-code-starter.roles:
        _payload: user.roles
      profile.given_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.given_name
            - ''
      profile.family_name:
        _string.trim:
          _if_none:
            - _payload: user.profile.family_name
            - ''
      profile.name:
        _payload: name
      profile.color:
        _payload: user.profile.color
      global_attributes.github.username:
        _payload: user.gh_username
      updated:
        _ref: shared/change_stamp.yaml
