# @cascade: MongoDB Request - Single User Retrieval
# AI Context: Retrieve specific user data with role and profile information
# MCP Integration: Validate MongoDBAggregation request schema and projection
# Patterns: User data retrieval, role projection, profile information access
# Dependencies: connections.yaml users collection, role system, URL query parameters

id: get_user
type: MongoDBAggregation
connectionId: user_contacts
payload:
  user_id:
    _input: user_id
properties:
  pipeline:
    - $match:
        _id:
          _payload: user_id
    - $project:
        email: 1
        profile: 1
        disabled: 1
        roles: $apps.lowdefy-vibe-code-starter.roles
        gh_username: $global_attributes.github.username
