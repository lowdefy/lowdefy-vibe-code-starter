# @context: Lowdefy Page - User Invitations Management
# AI Context: Form-based user invitation system with role assignment
# MCP Integration: Validate PageHeaderMenu, form components, and user management schemas
# Patterns: PageHeaderMenu > Content > form components, user role management
# Dependencies: requests/create_invite.yaml, user authentication, role system

id: invites-new
type: PageHeaderMenu
properties:
  title: New User
  header:
    theme: light
layout:
  contentJustify: center

requests:
  - _ref: pages/users/requests/create_invite.yaml
areas:
  footer:
    blocks:
      - _ref: shared/footer.yaml
  header:
    blocks:
      - _ref: shared/users/user_avatar.yaml

blocks:
  - id: new_invite_card
    type: Card
    layout:
      contentGutter: 16
    style:
      maxWidth: 800
    areas:
      cover:
        blocks:
          - _ref: shared/components/back_button.yaml
    blocks:
      - id: new_invite_title
        type: Title
        style:
          textAlign: center
        properties:
          content: New Invite
          level: 1

      - id: user.email
        type: TextInput
        required: true
        properties:
          title: Email
        validate:
          - message: Please provide a valid email address.
            status: warning
            pass:
              _regex: '^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$'
          - message: Please provide a valid email address.
            status: error
            pass:
              _regex: '^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$'
      - id: user.profile.given_name
        type: TextInput
        properties:
          title: First Name
      - id: user.profile.family_name
        type: TextInput
        properties:
          title: Last Name
      - id: user.roles
        type: MultipleSelector
        properties:
          title: Roles
          options:
            _ref: roles.yaml
      - id: footer_buttons_box
        type: Box
        layout:
          contentDirection: row-reverse
        blocks:
          - id: new_invite_button
            type: Button
            layout:
              span: 12
            properties:
              title: Save
              icon: AiOutlineSave
              block: true
            events:
              onClick:
                - id: validate
                  type: Validate
                - id: create_invite
                  type: Request
                  params:
                    - create_invite
                - id: reset
                  type: Reset
                - id: link_to_user
                  type: Link
                  params:
                    pageId: invites
