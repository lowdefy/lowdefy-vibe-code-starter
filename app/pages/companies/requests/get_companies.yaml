# @context: MongoDB Request - Companies Data Retrieval
# AI Context: Use aggregation pipelines, sort by created timestamp descending
# MCP Integration: Validate MongoDBAggregation request schema and pipeline stages
# Patterns: pipeline with $sort stage, consistent field projection
# Dependencies: connections.yaml companies collection, companies page

id: get_companies
type: MongoDBAggregation
connectionId: companies
properties:
  pipeline:
    - $sort:
        created.timestamp: -1
